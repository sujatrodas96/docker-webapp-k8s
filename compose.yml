services:
  devopsdb:
    image: shaikmustafa/king:db
    environment:
      MYSQL_ROOT_PASSWORD: localrootpass
      MYSQL_USER: vprofile
      MYSQL_PASSWORD: localapppass
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      retries: 12
    networks:
      - "mynetwork"
    restart: "always"
    volumes:
      - myvolume:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "2.0"      
          memory: 2G       
        reservations:
          cpus: "0.5"  
          memory: 1G 
    
  app:
    image: shaikmustafa/king:app
    ports:
      - "1234:8080"
    environment:
      JDBC_URL: "jdbc:mysql://devopsdb:3306/accounts?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull&useSSL=false"
      JDBC_USERNAME: vprofile
      JDBC_PASSWORD: localapppass
    depends_on:
      devopsdb:
        condition: service_healthy
    networks:
      - "mynetwork"
    deploy:
      resources:
        limits:
          cpus: "1.0"      
          memory: 512M     
        reservations:
          cpus: "0.25"     
          memory: 256M  
    volumes:
      - mydata:/application
  
networks:
  mynetwork:
    driver: bridge

volumes:
  myvolume:
  mydata:

